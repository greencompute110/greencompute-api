name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The uv workspace + tests/conftest.py expect the protocol repo as a
      # SIBLING directory (path = "../../../greencompute/protocol"), so check
      # both repos out side by side.
      - uses: actions/checkout@v4
        with:
          path: greencompute-api

      - uses: actions/checkout@v4
        with:
          repository: greencompute110/greencompute
          path: greencompute

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Hard gate on the errors that are always bugs (syntax errors,
      # undefined names). The full ruff ruleset has a pre-existing backlog,
      # so it runs advisory-only below.
      - name: Lint (critical)
        working-directory: greencompute-api
        run: uvx ruff check --select E9,F63,F7,F82 .

      - name: Lint (advisory)
        working-directory: greencompute-api
        continue-on-error: true
        run: uvx ruff check .

      # tests/unit covers more than the gateway — it also exercises validator
      # and persistence code — but the gateway package is what hosts the test
      # environment, so anything those tests need must be listed here too.
      # `cryptography` backs the AES-256-GCM sealing of custodied provider
      # wallet mnemonics; it is declared by greencompute-validator, whose
      # dependency tree `--package greencompute-gateway` never resolves.
      #
      # Deliberately NOT guarded with a skipif in the test module: these tests
      # protect the encryption of keys that control real funds, so a missing
      # dependency must fail CI loudly rather than silently skip the suite.
      - name: Unit tests
        working-directory: greencompute-api
        run: uv run --package greencompute-gateway --with pytest --with cryptography pytest tests/unit -q
