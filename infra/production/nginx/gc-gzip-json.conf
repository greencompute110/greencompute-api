# /etc/nginx/conf.d/gc-gzip-json.conf: compress the API's JSON responses.
# nginx.conf turns gzip on but only for HTML, and not for proxied responses,
# so lists like /platform/deployments went out as megabytes of raw JSON.
# Streaming model output is text/event-stream and stays uncompressed.
gzip_proxied any;
gzip_types application/json;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_vary on;
