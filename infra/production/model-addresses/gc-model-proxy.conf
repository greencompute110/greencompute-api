# /etc/nginx/snippets/gc-model-proxy.conf: what a model address serves.
# Only /v1/ goes to the gateway (which routes by Host to the model; an API
# key is still required). Same proxy settings as api.green-compute.com.

location /v1/ {
    proxy_pass http://127.0.0.1:28000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long prefills, streaming, big bodies.
    proxy_connect_timeout 75s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    send_timeout          3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    client_max_body_size 256m;
    client_body_timeout  3600s;
}

location = / {
    default_type text/plain;
    return 200 "Green Compute model endpoint. Use https://$host/v1 as an OpenAI base URL with your API key.\n";
}

location / {
    return 404;
}
